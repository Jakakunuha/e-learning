<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Learning School</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .hide-scroll::-webkit-scrollbar {
            display: none;
        }

        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .page-transition {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb', // Blue-600
                        secondary: '#475569', // Slate-600
                        accent: '#10b981', // Emerald-500
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased overflow-x-hidden">

    <!-- APP CONTAINER -->
    <div id="app" class="min-h-screen flex flex-col md:flex-row">

        <!-- SIDEBAR (Admin/Guru) -->
        <aside id="sidebar"
            class="hidden md:flex flex-col w-64 bg-slate-900 text-white min-h-screen fixed z-20 transition-transform duration-300">
            <div class="flex items-center justify-center h-16 border-b border-slate-700">
                <i class="fas fa-graduation-cap text-2xl text-blue-400 mr-2"></i>
                <span class="text-xl font-bold tracking-wider">SmartSchool</span>
            </div>
            <div class="p-4">
                <div class="flex items-center space-x-3 mb-6 bg-slate-800 p-3 rounded-lg">
                    <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-lg font-bold uppercase"
                        id="sidebar-avatar">A</div>
                    <div>
                        <p class="text-sm font-semibold truncate" id="sidebar-name">Admin Utama</p>
                        <p class="text-xs text-slate-400 capitalize" id="sidebar-role">Administrator</p>
                    </div>
                </div>
                <nav class="space-y-1" id="sidebar-nav">
                    <!-- Dinamis diisi oleh JS -->
                </nav>
            </div>
            <div class="mt-auto p-4 border-t border-slate-700">
                <button onclick="logout()"
                    class="w-full flex items-center p-3 text-sm font-medium rounded-lg text-red-400 hover:bg-slate-800 hover:text-red-300 transition-colors">
                    <i class="fas fa-sign-out-alt w-6"></i> Logout
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT WRAPPER -->
        <div id="main-wrapper" class="flex-1 flex flex-col md:ml-0 transition-all duration-300 w-full">

            <!-- TOP NAVBAR -->
            <header
                class="bg-white shadow-sm h-16 fixed w-full md:w-[calc(100%-16rem)] z-10 flex items-center justify-between px-4 lg:px-8 transition-all duration-300"
                id="top-navbar">
                <div class="flex items-center">
                    <button id="mobile-menu-btn"
                        class="md:hidden mr-4 text-slate-600 hover:text-slate-900 focus:outline-none">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <div class="md:hidden flex items-center" id="mobile-brand">
                        <i class="fas fa-graduation-cap text-blue-600 mr-2 text-xl"></i>
                        <span class="font-bold text-lg">SmartSchool</span>
                    </div>
                    <h1 class="hidden md:block text-xl font-semibold text-slate-800" id="page-title">Dashboard</h1>
                </div>

                <div class="flex items-center space-x-4">
                    <!-- Public Nav -->
                    <div id="public-nav" class="hidden md:flex space-x-4 text-sm font-medium text-slate-600">
                        <a href="#" onclick="navigate('home')" class="hover:text-blue-600">Beranda</a>
                        <a href="#" onclick="navigate('public-materi')" class="hover:text-blue-600">Materi</a>
                        <a href="#" onclick="navigate('login')"
                            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">Login</a>
                    </div>
                    <!-- Notif -->
                    <button id="notif-btn" class="hidden text-slate-500 hover:text-blue-600 relative">
                        <i class="far fa-bell text-xl"></i>
                        <span class="absolute top-0 right-0 -mt-1 -mr-1 flex h-3 w-3">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                        </span>
                    </button>
                </div>
            </header>

            <!-- VIEW CONTAINER -->
            <main class="flex-1 overflow-y-auto p-4 lg:p-8 mt-16 pb-20 md:pb-8 bg-slate-50" id="view-container">
                <!-- Konten Halaman akan dirender di sini oleh JS -->
            </main>
        </div>

        <!-- BOTTOM NAVIGATION (Mobile Only) -->
        <nav id="bottom-nav"
            class="hidden md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around p-2 z-20 pb-safe">
            <!-- Dinamis diisi oleh JS -->
        </nav>

        <!-- FULLSCREEN LOADER OVERLAY -->
        <div id="global-loader"
            class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 z-50 flex flex-col items-center justify-center text-white backdrop-blur-sm">
            <div class="loader mb-4 w-12 h-12 border-4 border-t-blue-500 border-white"></div>
            <p class="font-medium animate-pulse">Memproses Data...</p>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /* ==========================================
           1. KONFIGURASI & STATE MANAGEMENT
           ========================================== */
        // UBAH INI dengan URL Web App GAS Anda saat production
        const GAS_WEB_APP_URL = "";
        const IS_PREVIEW = GAS_WEB_APP_URL === "";

        let state = {
            user: null,
            currentRoute: 'home',
            data: {
                materi: [], tugas: [], kuis: [], soal: [], siswa: [], guru: [], kelas: [], mapel: [],
                stats: { totalGuru: 0, totalSiswa: 0, totalKelas: 0, totalMateri: 0 },
                currentViewData: null
            }
        };

        /* ==========================================
           2. MOCK DATA ENGINE (UNTUK PREVIEW)
           ========================================== */
        const MOCK_DATA = {
            users: [
                { id: 'u1', username: 'admin', password: '123', role: 'admin', name: 'Admin Utama' },
                { id: 'u2', username: 'guru', password: '123', role: 'guru', name: 'Budi Santoso, S.Pd' }
            ],
            stats: { totalGuru: 24, totalSiswa: 350, totalKelas: 12, totalMateri: 85 },
            guru: [
                { id: 'g1', nama: 'Budi Santoso, S.Pd' },
                { id: 'g2', nama: 'Siti Aminah, S.Pd' },
                { id: 'g3', nama: 'Bapak Andi, S.Kom' }
            ],
            mapel: [
                { id: 'mp1', nama: 'Matematika' },
                { id: 'mp2', nama: 'Bahasa Indonesia' },
                { id: 'mp3', nama: 'Sejarah' },
                { id: 'mp4', nama: 'Informatika' }
            ],
            kelas: [
                { id: 'k1', nama: 'X IPA 1', wali: 'Budi Santoso, S.Pd' },
                { id: 'k2', nama: 'X IPA 2', wali: 'Bapak Andi, S.Kom' },
                { id: 'k3', nama: 'XI IPS 2', wali: 'Siti Aminah, S.Pd' }
            ],
            materi: [
                { id: 'm1', judul: 'Aljabar Linier Dasar', mapel: 'Matematika', kelas: 'X IPA 1', tipe: 'pdf', pembuat: 'Budi Santoso, S.Pd', date: '2026-06-10', link: 'https://drive.google.com/' },
                { id: 'm2', judul: 'Sejarah Kemerdekaan', mapel: 'Sejarah', kelas: 'XI IPS 2', tipe: 'youtube', pembuat: 'Siti Aminah, S.Pd', date: '2026-06-12', link: 'https://youtube.com/' },
            ],
            tugas: [
                { id: 't1', judul: 'Latihan Aljabar 1', mapel: 'Matematika', kelas: 'X IPA 1', deadline: '2026-06-20', terkumpul: 5, total: 30, guru: 'Budi Santoso, S.Pd' },
            ],
            kuis: [
                { id: 'q1', judul: 'Ulangan Harian 1 - Aljabar', mapel: 'Matematika', kelas: 'X IPA 1', durasi: '60', guru: 'Budi Santoso, S.Pd' }
            ],
            soal: [
                { id: 'sq1', id_kuis: 'q1', pertanyaan: 'Berapakah 5 + 5?', opsi_a: '8', opsi_b: '9', opsi_c: '10', opsi_d: '11', kunci: 'c' },
                { id: 'sq2', id_kuis: 'q1', pertanyaan: 'Berapakah 10 x 2?', opsi_a: '20', opsi_b: '12', opsi_c: '10', opsi_d: '0', kunci: 'a' }
            ],
            siswa: [
                { id: 's1', nis: '1001', nama: 'Ahmad Dahlan', kelas: 'X IPA 1', jk: 'L' },
                { id: 's2', nis: '1002', nama: 'Siti Fatimah', kelas: 'X IPA 1', jk: 'P' },
                { id: 's3', nis: '1003', nama: 'Budi Raharjo', kelas: 'X IPA 2', jk: 'L' },
            ]
        };

        /* ==========================================
           3. CORE FUNCTIONS (API & AUTH)
           ========================================== */
        async function apiCall(action, payload = {}) {
            showLoader();
            try {
                if (IS_PREVIEW) {
                    await new Promise(resolve => setTimeout(resolve, 600));
                    return handleMockApi(action, payload);
                } else {
                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action, payload })
                    });
                    return await response.json();
                }
            } catch (error) {
                console.error("API Error:", error);
                Swal.fire('Error', 'Terjadi kesalahan koneksi', 'error');
                return { success: false, message: error.message };
            } finally {
                hideLoader();
            }
        }

        function handleMockApi(action, payload) {
            switch (action) {
                case 'login':
                    const user = MOCK_DATA.users.find(u => u.username === payload.username && u.password === payload.password);
                    if (user) return { success: true, data: { id: user.id, role: user.role, name: user.name } };
                    return { success: false, message: 'Username atau Password salah' };
                case 'get_dashboard': return { success: true, data: MOCK_DATA.stats };
                case 'get_materi': return { success: true, data: MOCK_DATA.materi };
                case 'save_materi':
                    const newMateri = { ...payload, id: 'm' + Date.now(), date: new Date().toISOString().split('T')[0], pembuat: payload.pembuat || state.user.name };
                    MOCK_DATA.materi.unshift(newMateri);
                    return { success: true, message: 'Materi berhasil disimpan', data: newMateri };
                case 'get_kelas': return { success: true, data: MOCK_DATA.kelas };
                case 'save_kelas':
                    const newKelas = { ...payload, id: 'k' + Date.now() };
                    MOCK_DATA.kelas.push(newKelas);
                    return { success: true, message: 'Kelas berhasil dibuat', data: newKelas };
                case 'get_guru': return { success: true, data: MOCK_DATA.guru };
                case 'save_guru':
                    const newGuru = { ...payload, id: 'g' + Date.now() };
                    MOCK_DATA.guru.push(newGuru);
                    return { success: true, message: 'Guru berhasil ditambahkan', data: newGuru };
                case 'get_mapel': return { success: true, data: MOCK_DATA.mapel };
                case 'save_mapel':
                    const newMapel = { ...payload, id: 'mp' + Date.now() };
                    MOCK_DATA.mapel.push(newMapel);
                    return { success: true, message: 'Mata Pelajaran berhasil ditambahkan', data: newMapel };
                case 'get_siswa': return { success: true, data: MOCK_DATA.siswa };
                case 'save_siswa':
                    const newSiswa = { ...payload, id: 's' + Date.now() };
                    MOCK_DATA.siswa.push(newSiswa);
                    return { success: true, message: 'Siswa berhasil ditambahkan ke kelas', data: newSiswa };
                case 'get_tugas': return { success: true, data: MOCK_DATA.tugas };
                case 'save_tugas':
                    const newTugas = { ...payload, id: 't' + Date.now(), terkumpul: 0, total: 30 };
                    MOCK_DATA.tugas.push(newTugas);
                    return { success: true, message: 'Tugas berhasil dibuat', data: newTugas };
                case 'get_kuis': return { success: true, data: MOCK_DATA.kuis };
                case 'save_kuis':
                    const newKuis = { ...payload, id: 'q' + Date.now() };
                    MOCK_DATA.kuis.push(newKuis);
                    return { success: true, message: 'Kuis berhasil dibuat', data: newKuis };
                case 'get_soal': return { success: true, data: MOCK_DATA.soal };
                case 'save_soal':
                    const newSoal = { ...payload, id: 'sq' + Date.now() };
                    MOCK_DATA.soal.push(newSoal);
                    return { success: true, message: 'Soal ditambahkan', data: newSoal };
                default: return { success: false, message: 'Action not found in mock' };
            }
        }

        async function login(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const res = await apiCall('login', { username: user, password: pass });
            if (res.success) {
                state.user = res.data;
                localStorage.setItem('sls_user', JSON.stringify(res.data));
                Swal.fire({ icon: 'success', title: 'Login Berhasil', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
                setupLayout();
                navigate('dashboard');
            } else {
                Swal.fire('Gagal', res.message, 'error');
            }
        }

        function logout() {
            Swal.fire({
                title: 'Keluar?', text: "Anda akan keluar dari sistem", icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Logout'
            }).then((result) => {
                if (result.isConfirmed) {
                    state.user = null;
                    localStorage.removeItem('sls_user');
                    setupLayout();
                    navigate('home');
                }
            });
        }

        function checkAuth() {
            const saved = localStorage.getItem('sls_user');
            if (saved) { state.user = JSON.parse(saved); return true; }
            return false;
        }

        function showLoader() { document.getElementById('global-loader').classList.remove('hidden'); }
        function hideLoader() { document.getElementById('global-loader').classList.add('hidden'); }
        function base64Encode(str) { return btoa(unescape(encodeURIComponent(str))); }
        function base64Decode(str) { return decodeURIComponent(escape(atob(str))); }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                Swal.fire({ icon: 'success', title: 'Link disalin!', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
            }).catch(err => {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                Swal.fire({ icon: 'success', title: 'Link disalin!', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
            });
        }

        /* ==========================================
           4. ROUTING & UI LAYOUT
           ========================================== */
        const ROUTES = {
            'home': { title: 'Beranda', auth: false, render: renderHome },
            'login': { title: 'Login Sistem', auth: false, render: renderLogin },
            'public-materi': { title: 'Materi Pembelajaran', auth: false, render: renderPublicMateri },
            'public-kuis': { title: 'Kerjakan Kuis', auth: false, render: renderPublicKuis },
            'public-tugas': { title: 'Kerjakan Tugas', auth: false, render: renderNilaiPlaceholder },
            'dashboard': { title: 'Dashboard', auth: true, render: renderDashboard },
            'guru': { title: 'Master Data Guru', auth: true, render: renderGuruAdmin },
            'mapel': { title: 'Master Data Mapel', auth: true, render: renderMapelAdmin },
            'kelas': { title: 'Master Data Kelas', auth: true, render: renderKelasAdmin },
            'materi': { title: 'Manajemen Materi', auth: true, render: renderMateriAdmin },
            'tugas': { title: 'Manajemen Tugas', auth: true, render: renderTugasAdmin },
            'kuis': { title: 'Manajemen Kuis', auth: true, render: renderKuisAdmin },
            'nilai': { title: 'Buku Nilai', auth: true, render: renderNilaiPlaceholder }
        };

        const MENU_ITEMS = [
            { id: 'dashboard', icon: 'fa-home', label: 'Dashboard', roles: ['admin', 'guru'] },
            { id: 'guru', icon: 'fa-user-tie', label: 'Data Guru', roles: ['admin'] },
            { id: 'mapel', icon: 'fa-book', label: 'Mapel', roles: ['admin'] },
            { id: 'kelas', icon: 'fa-school', label: 'Kelas & Siswa', roles: ['admin'] },
            { id: 'materi', icon: 'fa-book-open', label: 'Materi', roles: ['admin', 'guru'] },
            { id: 'tugas', icon: 'fa-tasks', label: 'Tugas', roles: ['admin', 'guru'] },
            { id: 'kuis', icon: 'fa-list-check', label: 'Kuis (PG)', roles: ['admin', 'guru'] },
            { id: 'nilai', icon: 'fa-chart-bar', label: 'Nilai & Rapor', roles: ['admin', 'guru'] },
        ];

        function navigate(routeId) {
            const route = ROUTES[routeId];
            if (!route) return;

            if (route.auth && !state.user) { navigate('login'); return; }
            if (!route.auth && state.user && routeId === 'login') { navigate('dashboard'); return; }

            state.currentRoute = routeId;
            document.getElementById('page-title').innerText = route.title;

            const container = document.getElementById('view-container');
            container.innerHTML = '';
            container.className = 'flex-1 overflow-y-auto p-4 lg:p-8 mt-16 pb-20 md:pb-8 bg-slate-50 page-transition';
            route.render(container);

            updateActiveMenu();

            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) toggleMobileMenu();
        }

        function setupLayout() {
            const sidebar = document.getElementById('sidebar');
            const mainWrap = document.getElementById('main-wrapper');
            const publicNav = document.getElementById('public-nav');
            const notifBtn = document.getElementById('notif-btn');
            const bottomNav = document.getElementById('bottom-nav');

            if (state.user) {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('-translate-x-full', 'md:translate-x-0');
                mainWrap.classList.add('md:ml-64');
                publicNav.classList.add('hidden');
                notifBtn.classList.remove('hidden');
                bottomNav.classList.remove('hidden');
                document.getElementById('top-navbar').classList.add('md:w-[calc(100%-16rem)]');

                document.getElementById('sidebar-name').innerText = state.user.name;
                document.getElementById('sidebar-role').innerText = state.user.role;
                document.getElementById('sidebar-avatar').innerText = state.user.name.charAt(0);
                buildMenus();
            } else {
                sidebar.classList.add('hidden');
                mainWrap.classList.remove('md:ml-64');
                publicNav.classList.remove('hidden');
                notifBtn.classList.add('hidden');
                bottomNav.classList.add('hidden');
                document.getElementById('top-navbar').classList.remove('md:w-[calc(100%-16rem)]');
            }
        }

        function buildMenus() {
            const sidebarNav = document.getElementById('sidebar-nav');
            const bottomNav = document.getElementById('bottom-nav');
            sidebarNav.innerHTML = ''; bottomNav.innerHTML = '';

            MENU_ITEMS.filter(m => m.roles.includes(state.user.role)).forEach(menu => {
                const a = document.createElement('a');
                a.href = `#${menu.id}`;
                a.onclick = (e) => { e.preventDefault(); navigate(menu.id); };
                a.className = `menu-item flex items-center p-3 text-sm font-medium rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors mb-1`;
                a.dataset.target = menu.id;
                a.innerHTML = `<i class="fas ${menu.icon} w-6 text-center mr-2"></i> ${menu.label}`;
                sidebarNav.appendChild(a);

                const b = document.createElement('a');
                b.href = `#${menu.id}`;
                b.onclick = (e) => { e.preventDefault(); navigate(menu.id); };
                b.className = `bottom-item flex flex-col items-center justify-center w-full text-slate-500 hover:text-blue-600 transition-colors`;
                b.dataset.target = menu.id;
                b.innerHTML = `<i class="fas ${menu.icon} text-xl mb-1"></i><span class="text-[10px] font-medium">${menu.label}</span>`;
                bottomNav.appendChild(b);
            });
        }

        function updateActiveMenu() {
            document.querySelectorAll('.menu-item').forEach(el => {
                if (el.dataset.target === state.currentRoute) { el.classList.add('bg-blue-600', 'text-white'); el.classList.remove('text-slate-300', 'hover:bg-slate-800'); }
                else { el.classList.remove('bg-blue-600', 'text-white'); el.classList.add('text-slate-300', 'hover:bg-slate-800'); }
            });
            document.querySelectorAll('.bottom-item').forEach(el => {
                if (el.dataset.target === state.currentRoute) { el.classList.add('text-blue-600'); el.classList.remove('text-slate-500'); }
                else { el.classList.remove('text-blue-600'); el.classList.add('text-slate-500'); }
            });
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('-translate-x-full')) { sidebar.classList.remove('-translate-x-full', 'hidden'); sidebar.classList.add('translate-x-0'); }
            else { sidebar.classList.add('-translate-x-full'); }
        }

        /* ==========================================
           5. VIEW RENDERERS (HALAMAN)
           ========================================== */
        // -- PUBLIC: HOME --
        function renderHome(container) {
            container.innerHTML = `
                <div class="max-w-6xl mx-auto">
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-8 md:p-16 text-white text-center shadow-lg">
                        <h1 class="text-3xl md:text-5xl font-bold mb-4">Masa Depan Pendidikan Digital</h1>
                        <p class="text-lg md:text-xl text-blue-100 mb-8 max-w-2xl mx-auto">Smart Learning School mengintegrasikan materi, tugas, dan evaluasi dalam satu platform yang mudah digunakan oleh guru dan siswa.</p>
                        <div class="flex justify-center space-x-4">
                            <button onclick="navigate('public-materi')" class="bg-white text-blue-600 px-6 py-3 rounded-lg font-semibold hover:bg-slate-100 transition shadow">Jelajahi Materi</button>
                            <button onclick="navigate('login')" class="bg-blue-800 bg-opacity-50 border border-blue-400 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-800 transition">Login Sistem</button>
                        </div>

                            <div class="flex items-center justify-between mb-3"><div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl"><i class="fas fa-list-check"></i></div><span class="bg-slate-100 text-slate-600 text-xs font-bold px-2 py-1 rounded"><i class="fas fa-stopwatch"></i> ${k.durasi} Menit</span></div>
                            <h3 class="font-bold text-lg text-slate-800 leading-tight mb-1">${k.judul}</h3>
                            <p class="text-sm text-slate-600 mb-1">${k.mapel} • <span class="font-semibold text-indigo-600">${k.kelas}</span></p>
                            <p class="text-xs text-slate-400 mb-4">Oleh: ${k.guru}</p>
                            
                            <div class="mt-auto pt-4 border-t border-slate-100 flex flex-col gap-2">
                                <button onclick="renderDetailKuis('${k.id}')" class="w-full bg-indigo-50 text-indigo-700 border border-indigo-200 py-2 rounded hover:bg-indigo-100 text-sm font-semibold transition">Kelola Soal</button>
                                <div class="flex gap-2">
                                    <button onclick="copyToClipboard('${linkKuis}')" class="flex-1 bg-white border border-slate-300 text-slate-700 py-1.5 rounded hover:bg-slate-50 text-xs font-medium transition"><i class="fas fa-link"></i> Salin Link</button>
                                    <button class="flex-1 bg-white border border-slate-300 text-slate-700 py-1.5 rounded hover:bg-slate-50 text-xs font-medium transition">Hasil Nilai</button>
                                </div>
                            </div>
                        </div>
                        `
            }).join('')}
                    ${displayKuis.length === 0 ? `<div class="col-span-full p-8 text-center text-slate-500 bg-white rounded-xl border border-dashed border-slate-300">Belum ada Kuis yang Anda buat.</div>` : ''}
                </div>

                <div id="modal-kuis" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl flex flex-col animate-[fadeIn_0.2s_ease-out]">
                        <div class="flex justify-between items-center p-5 border-b border-slate-100"><h3 class="text-lg font-bold text-slate-800">Setup Kuis Baru</h3><button onclick="closeModal('modal-kuis')" class="text-slate-400 hover:text-red-500"><i class="fas fa-times"></i></button></div>
                        <div class="p-5 overflow-y-auto custom-scroll">
                            <form onsubmit="saveKuis(event)">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    <div class="md:col-span-2"><label class="block text-sm font-medium text-slate-700 mb-1">Judul Kuis (Cth: Ulangan Harian 1)</label><input type="text" id="q_judul" required class="w-full rounded-md border-slate-300 border p-2 focus:ring-indigo-500 outline-none"></div>
                                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Guru Pembuat</label><select id="q_guru" required class="w-full rounded-md border-slate-300 border p-2 focus:ring-indigo-500 outline-none"><option value="">Pilih Guru...</option>${state.data.guru.map(g => `<option value="${g.nama}">${g.nama}</option>`).join('')}</select></div>
                                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Mata Pelajaran</label><select id="q_mapel" required class="w-full rounded-md border-slate-300 border p-2 focus:ring-indigo-500 outline-none"><option value="">Pilih Mapel...</option>${state.data.mapel.map(mp => `<option value="${mp.nama}">${mp.nama}</option>`).join('')}</select></div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Kelas Target</label>
                                        <select id="q_kelas" required class="w-full rounded-md border-slate-300 border p-2 focus:ring-indigo-500 outline-none">
                                            <option value="">Pilih Kelas...</option>
                                            <optgroup label="Kelas 10"><option value="X IPA 1">X IPA 1</option><option value="X IPA 2">X IPA 2</option><option value="X IPS 1">X IPS 1</option><option value="X IPS 2">X IPS 2</option></optgroup>
                                            <optgroup label="Kelas 11"><option value="XI IPA 1">XI IPA 1</option><option value="XI IPA 2">XI IPA 2</option><option value="XI IPS 1">XI IPS 1</option><option value="XI IPS 2">XI IPS 2</option></optgroup>
                                            <optgroup label="Kelas 12"><option value="XII IPA 1">XII IPA 1</option><option value="XII IPA 2">XII IPA 2</option><option value="XII IPS 1">XII IPS 1</option><option value="XII IPS 2">XII IPS 2</option></optgroup>
                                        </select>
                                    </div>
                                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Durasi Pengerjaan (Menit)</label><input type="number" id="q_durasi" required min="5" value="60" class="w-full rounded-md border-slate-300 border p-2 focus:ring-indigo-500 outline-none"></div>
                                </div>
                                <div class="flex justify-end pt-4 border-t border-slate-100"><button type="button" onclick="closeModal('modal-kuis')" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg mr-2 transition">Batal</button><button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium shadow hover:bg-indigo-700">Simpan & Lanjut Buat Soal</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }
        function openModalKuis() { document.getElementById('modal-kuis').classList.remove('hidden'); if (state.user.role === 'guru') document.getElementById('q_guru').value = state.user.name; }
        async function saveKuis(e) {
            e.preventDefault();
            const payload = { judul: document.getElementById('q_judul').value, guru: document.getElementById('q_guru').value, mapel: document.getElementById('q_mapel').value, kelas: document.getElementById('q_kelas').value, durasi: document.getElementById('q_durasi').value };
            closeModal('modal-kuis');
            const res = await apiCall('save_kuis', payload);
            if (res.success) { state.data.kuis = []; Swal.fire('Berhasil', 'Kuis dibuat. Silakan tambahkan soal.', 'success'); renderDetailKuis(res.data.id); }
        }

        async function renderDetailKuis(kuisId) {
            if (state.data.kuis.length === 0) await apiCall('get_kuis').then(r => state.data.kuis = r.data);
            if (state.data.soal.length === 0) await apiCall('get_soal').then(r => state.data.soal = r.data);

            const kuis = state.data.kuis.find(k => k.id === kuisId);
            const soalKuis = state.data.soal.filter(s => s.id_kuis === kuisId);
            state.data.currentViewData = kuisId;

            const container = document.getElementById('view-container');
            container.innerHTML = `
                <div class="mb-6">
                    <button onclick="renderKuisAdmin(document.getElementById('view-container'))" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium mb-4 inline-flex items-center transition"><div class="w-6 h-6 rounded-full bg-indigo-100 flex items-center justify-center mr-2"><i class="fas fa-arrow-left"></i></div> Kembali ke Daftar Kuis</button>
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <div><h2 class="text-xl font-bold text-slate-800">${kuis.judul}</h2><p class="text-slate-500 text-sm">${kuis.mapel} • Kelas ${kuis.kelas} • ${kuis.durasi} Menit</p></div>
                        <button onclick="openModalSoal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-medium shadow transition flex items-center"><i class="fas fa-plus mr-2"></i> Tambah Soal</button>
                    </div>
                </div>
                <div class="space-y-4">
                    ${soalKuis.map((s, idx) => `
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 relative">
                            <div class="absolute top-4 right-4 flex space-x-2"><button class="text-slate-400 hover:text-red-500"><i class="fas fa-trash"></i></button></div>
                            <h4 class="font-bold text-slate-800 mb-3">${idx + 1}. ${s.pertanyaan}</h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm">
                                <div class="p-2 rounded border ${s.kunci === 'a' ? 'bg-green-50 border-green-200 font-semibold text-green-700' : 'border-slate-200 text-slate-600'}">A. ${s.opsi_a}</div>
                                <div class="p-2 rounded border ${s.kunci === 'b' ? 'bg-green-50 border-green-200 font-semibold text-green-700' : 'border-slate-200 text-slate-600'}">B. ${s.opsi_b}</div>
                                <div class="p-2 rounded border ${s.kunci === 'c' ? 'bg-green-50 border-green-200 font-semibold text-green-700' : 'border-slate-200 text-slate-600'}">C. ${s.opsi_c}</div>
                                <div class="p-2 rounded border ${s.kunci === 'd' ? 'bg-green-50 border-green-200 font-semibold text-green-700' : 'border-slate-200 text-slate-600'}">D. ${s.opsi_d}</div>
                            </div>
                        </div>
                    `).join('')}
                    ${soalKuis.length === 0 ? `<div class="text-center p-8 text-slate-500 bg-white rounded border border-dashed">Belum ada soal. Klik Tambah Soal.</div>` : ''}
                </div>

                <div id="modal-soal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl flex flex-col animate-[fadeIn_0.2s_ease-out]">
                        <div class="flex justify-between items-center p-5 border-b border-slate-100"><h3 class="text-lg font-bold text-slate-800">Input Soal Pilihan Ganda</h3><button onclick="closeModal('modal-soal')" class="text-slate-400 hover:text-red-500"><i class="fas fa-times"></i></button></div>
                        <div class="p-5 overflow-y-auto max-h-[70vh] custom-scroll">
                            <form onsubmit="saveSoal(event)">
                                <div class="mb-4"><label class="block text-sm font-medium text-slate-700 mb-1">Pertanyaan</label><textarea id="s_pertanyaan" required rows="3" class="w-full rounded-md border-slate-300 border p-2 focus:ring-indigo-500 outline-none"></textarea></div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    <div><label class="block text-xs font-bold text-slate-500 mb-1">Opsi A</label><input type="text" id="s_a" required class="w-full rounded border p-2"></div>
                                    <div><label class="block text-xs font-bold text-slate-500 mb-1">Opsi B</label><input type="text" id="s_b" required class="w-full rounded border p-2"></div>
                                    <div><label class="block text-xs font-bold text-slate-500 mb-1">Opsi C</label><input type="text" id="s_c" required class="w-full rounded border p-2"></div>
                                    <div><label class="block text-xs font-bold text-slate-500 mb-1">Opsi D</label><input type="text" id="s_d" required class="w-full rounded border p-2"></div>
                                </div>
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Kunci Jawaban Benar</label>
                                    <select id="s_kunci" required class="w-full rounded-md border-slate-300 border p-2 focus:ring-indigo-500 outline-none bg-green-50 font-bold text-green-700"><option value="a">A</option><option value="b">B</option><option value="c">C</option><option value="d">D</option></select>
                                </div>
                                <div class="flex justify-end pt-4 border-t border-slate-100"><button type="button" onclick="closeModal('modal-soal')" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg mr-2 transition">Batal</button><button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium shadow hover:bg-indigo-700">Simpan Soal</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        function openModalSoal() { document.getElementById('modal-soal').classList.remove('hidden'); }
        async function saveSoal(e) {
            e.preventDefault();
            const payload = {
                id_kuis: state.data.currentViewData, pertanyaan: document.getElementById('s_pertanyaan').value, opsi_a: document.getElementById('s_a').value,
                opsi_b: document.getElementById('s_b').value, opsi_c: document.getElementById('s_c').value, opsi_d: document.getElementById('s_d').value, kunci: document.getElementById('s_kunci').value
            };
            closeModal('modal-soal');
            const res = await apiCall('save_soal', payload);
            if (res.success) { state.data.soal = []; Swal.fire({ icon: 'success', title: 'Soal tersimpan', toast: true, position: 'top-end', timer: 1000, showConfirmButton: false }); renderDetailKuis(state.data.currentViewData); }
        }

        // -- PUBLIC: MATERI LIST --
        async function renderPublicMateri(container) {
            if (state.data.materi.length === 0) { const res = await apiCall('get_materi'); if (res.success) state.data.materi = res.data; }
            container.innerHTML = `
                <div class="max-w-6xl mx-auto">
                    <div class="mb-8 text-center"><h2 class="text-3xl font-bold text-slate-800 mb-2">E-Learning Pustaka</h2><p class="text-slate-500">Akses materi pembelajaran yang dibagikan oleh guru Anda.</p></div>
                    <div class="flex flex-col md:flex-row gap-4 mb-8 justify-center">
                        <input type="text" placeholder="Cari judul materi..." class="w-full md:w-1/3 rounded-lg border-slate-300 border p-3 focus:ring-blue-500 shadow-sm outline-none">
                        <select class="w-full md:w-48 rounded-lg border-slate-300 border p-3 bg-white focus:ring-blue-500 shadow-sm outline-none"><option>Semua Kelas</option><option>X IPA</option><option>XI IPS</option></select>
                        <button class="bg-blue-600 text-white px-6 py-3 rounded-lg font-medium shadow hover:bg-blue-700 transition">Filter</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${state.data.materi.map(m => `
                            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col h-full hover:shadow-md transition">
                                <div class="flex items-center space-x-3 mb-4">
                                    <div class="w-12 h-12 rounded bg-${m.tipe === 'pdf' ? 'red' : (m.tipe === 'youtube' ? 'red' : 'blue')}-50 text-${m.tipe === 'pdf' ? 'red' : (m.tipe === 'youtube' ? 'red' : 'blue')}-600 flex items-center justify-center text-2xl flex-shrink-0">
                                        <i class="${m.tipe === 'pdf' ? 'fas fa-file-pdf' : (m.tipe === 'youtube' ? 'fab fa-youtube' : 'fas fa-link')}"></i>
                                    </div>
                                    <div><p class="text-xs text-slate-500 uppercase font-semibold">${m.mapel} • ${m.kelas}</p><h3 class="font-bold text-slate-800 leading-tight mt-1 line-clamp-2">${m.judul}</h3></div>
                                </div>
                                <div class="mt-auto pt-4 border-t border-slate-100 flex justify-between items-center text-xs text-slate-500">
                                    <span><i class="fas fa-user-edit mr-1"></i> ${m.pembuat}</span>
                                    <a href="${m.link ? m.link : '#'}" target="_blank" rel="noopener noreferrer" class="text-blue-600 font-semibold hover:underline flex items-center bg-blue-50 px-3 py-1.5 rounded-full transition hover:bg-blue-100">
                                        ${m.tipe === 'youtube' ? 'Tonton Video' : (m.tipe === 'pdf' ? 'Buka Dokumen' : 'Akses Link')} <i class="fas ${m.tipe === 'youtube' ? 'fa-play' : 'fa-external-link-alt'} ml-1.5 text-[10px]"></i>
                                    </a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // -- PUBLIC: HALAMAN SISWA MENGERJAKAN KUIS (SIMULASI GOOGLE FORM) --
        async function renderPublicKuis(container) {
            const urlParams = new URLSearchParams(window.location.hash.split('?')[1]);
            const kuisId = urlParams.get('id');

            if (!kuisId) return container.innerHTML = `<div class="text-center mt-20 text-red-500 font-bold">Error: Link Kuis Tidak Valid</div>`;

            if (state.data.kuis.length === 0) await apiCall('get_kuis').then(r => state.data.kuis = r.data);
            if (state.data.soal.length === 0) await apiCall('get_soal').then(r => state.data.soal = r.data);

            const kuis = state.data.kuis.find(k => k.id === kuisId);
            const soalKuis = state.data.soal.filter(s => s.id_kuis === kuisId);

            if (!kuis) return container.innerHTML = `<div class="text-center mt-20 text-red-500 font-bold">Error: Kuis tidak ditemukan.</div>`;

            container.innerHTML = `
                <div class="max-w-3xl mx-auto bg-white rounded-xl shadow border-t-8 border-t-indigo-600 overflow-hidden">
                    <div class="p-8 border-b border-slate-100 bg-indigo-50">
                        <h1 class="text-3xl font-bold text-slate-800 mb-2">${kuis.judul}</h1>
                        <p class="text-slate-600 mb-4">${kuis.mapel} • Kelas Target: ${kuis.kelas}</p>
                        <div class="flex items-center text-sm font-semibold text-red-500 bg-white inline-block px-3 py-1 rounded shadow-sm border border-red-100">
                            <i class="fas fa-stopwatch mr-2"></i> Waktu: ${kuis.durasi} Menit
                        </div>
                    </div>
                    
                    <div class="p-8">
                        <div class="mb-8 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                            <label class="block text-sm font-bold text-slate-800 mb-2">Nama Lengkap Siswa *</label>
                            <input type="text" id="siswa_nama" placeholder="Masukkan nama Anda" class="w-full border border-slate-300 p-3 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>

                        <div id="soal-container" class="space-y-8">
                            ${soalKuis.map((s, idx) => `
                                <div class="soal-item" data-id="${s.id}" data-kunci="${s.kunci}">
                                    <p class="font-bold text-slate-800 mb-4 text-lg">${idx + 1}. ${s.pertanyaan}</p>
                                    <div class="space-y-2">
                                        <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-slate-50 transition"><input type="radio" name="jawaban_${s.id}" value="a" class="mr-3 w-5 h-5 text-indigo-600"> <span>${s.opsi_a}</span></label>
                                        <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-slate-50 transition"><input type="radio" name="jawaban_${s.id}" value="b" class="mr-3 w-5 h-5 text-indigo-600"> <span>${s.opsi_b}</span></label>
                                        <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-slate-50 transition"><input type="radio" name="jawaban_${s.id}" value="c" class="mr-3 w-5 h-5 text-indigo-600"> <span>${s.opsi_c}</span></label>
                                        <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-slate-50 transition"><input type="radio" name="jawaban_${s.id}" value="d" class="mr-3 w-5 h-5 text-indigo-600"> <span>${s.opsi_d}</span></label>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="mt-10 pt-6 border-t border-slate-200 flex justify-end">
                            <button onclick="submitKuisSiswa()" class="bg-indigo-600 text-white px-8 py-3 rounded-lg font-bold text-lg hover:bg-indigo-700 shadow-lg transition">Kirim Jawaban</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function submitKuisSiswa() {
            const namaSiswa = document.getElementById('siswa_nama').value;
            if (!namaSiswa) return Swal.fire('Peringatan', 'Harap isi nama Anda!', 'warning');

            const soalItems = document.querySelectorAll('.soal-item');
            let benar = 0; let total = soalItems.length;

            soalItems.forEach(item => {
                const idSoal = item.dataset.id; const kunci = item.dataset.kunci;
                const jawabanTerpilih = document.querySelector(`input[name="jawaban_${idSoal}"]:checked`);
                if (jawabanTerpilih && jawabanTerpilih.value === kunci) { benar++; }
            });

            const nilaiAkhir = Math.round((benar / total) * 100) || 0;

            Swal.fire({
                title: 'Kuis Selesai!',
                html: `Terima kasih <b>${namaSiswa}</b>.<br>Skor Anda: <br><span class="text-5xl font-bold text-indigo-600 mt-2 block">${nilaiAkhir}</span>`,
                icon: 'success',
                confirmButtonText: 'Tutup'
            }).then(() => { navigate('home'); });
        }

        function renderNilaiPlaceholder(container) {
            container.innerHTML = `<div class="flex flex-col items-center justify-center h-64 text-slate-400"><i class="fas fa-tools text-5xl mb-4"></i><h2 class="text-xl font-bold text-slate-600">Modul Segera Hadir</h2><p class="text-sm mt-2 text-center max-w-md">Sistem Penilaian, Rapor Otomatis, dan Kuis sedang dalam tahap pengembangan (Tahap 2).</p></div>`;
        }

        /* ==========================================
           6. INITIALIZATION & EVENT LISTENERS
           ========================================== */
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setupLayout();
            const initialRoute = window.location.hash.replace('#', '') || (state.user ? 'dashboard' : 'home');
            navigate(initialRoute);
            document.getElementById('mobile-menu-btn').addEventListener('click', toggleMobileMenu);
            window.addEventListener('hashchange', () => {
                const route = window.location.hash.replace('#', '');
                if (route) navigate(route.split('?')[0]);
            });
        });
    </script>
</body>

</html>
