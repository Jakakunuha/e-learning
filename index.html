<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Learning School</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .hide-scroll::-webkit-scrollbar {
            display: none;
        }

        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .page-transition {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb', // Blue-600
                        secondary: '#475569', // Slate-600
                        accent: '#10b981', // Emerald-500
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased overflow-x-hidden">

    <!-- APP CONTAINER -->
    <div id="app" class="min-h-screen flex flex-col md:flex-row">

        <!-- SIDEBAR (Admin/Guru) - Hidden on Mobile, Visible on md -->
        <aside id="sidebar"
            class="hidden md:flex flex-col w-64 bg-slate-900 text-white min-h-screen fixed z-20 transition-transform duration-300">
            <div class="flex items-center justify-center h-16 border-b border-slate-700">
                <i class="fas fa-graduation-cap text-2xl text-blue-400 mr-2"></i>
                <span class="text-xl font-bold tracking-wider">SmartSchool</span>
            </div>
            <div class="p-4">
                <div class="flex items-center space-x-3 mb-6 bg-slate-800 p-3 rounded-lg">
                    <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-lg font-bold uppercase"
                        id="sidebar-avatar">A</div>
                    <div>
                        <p class="text-sm font-semibold truncate" id="sidebar-name">Admin Utama</p>
                        <p class="text-xs text-slate-400 capitalize" id="sidebar-role">Administrator</p>
                    </div>
                </div>
                <nav class="space-y-1" id="sidebar-nav">
                    <!-- Dinamis diisi oleh JS -->
                </nav>
            </div>
            <div class="mt-auto p-4 border-t border-slate-700">
                <button onclick="logout()"
                    class="w-full flex items-center p-3 text-sm font-medium rounded-lg text-red-400 hover:bg-slate-800 hover:text-red-300 transition-colors">
                    <i class="fas fa-sign-out-alt w-6"></i> Logout
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT WRAPPER -->
        <div id="main-wrapper" class="flex-1 flex flex-col md:ml-0 transition-all duration-300 w-full">

            <!-- TOP NAVBAR (Public & Auth Mobile) -->
            <header
                class="bg-white shadow-sm h-16 fixed w-full md:w-[calc(100%-16rem)] z-10 flex items-center justify-between px-4 lg:px-8 transition-all duration-300"
                id="top-navbar">
                <div class="flex items-center">
                    <button id="mobile-menu-btn"
                        class="md:hidden mr-4 text-slate-600 hover:text-slate-900 focus:outline-none">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <div class="md:hidden flex items-center" id="mobile-brand">
                        <i class="fas fa-graduation-cap text-blue-600 mr-2 text-xl"></i>
                        <span class="font-bold text-lg">SmartSchool</span>
                    </div>
                    <h1 class="hidden md:block text-xl font-semibold text-slate-800" id="page-title">Dashboard</h1>
                </div>

                <div class="flex items-center space-x-4">
                    <!-- Public Nav (Bila belum login) -->
                    <div id="public-nav" class="hidden md:flex space-x-4 text-sm font-medium text-slate-600">
                        <a href="#" onclick="navigate('home')" class="hover:text-blue-600">Beranda</a>
                        <a href="#" onclick="navigate('public-materi')" class="hover:text-blue-600">Materi</a>
                        <a href="#" onclick="navigate('login')"
                            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">Login</a>
                    </div>
                    <!-- Notif (Bila login) -->
                    <button id="notif-btn" class="hidden text-slate-500 hover:text-blue-600 relative">
                        <i class="far fa-bell text-xl"></i>
                        <span class="absolute top-0 right-0 -mt-1 -mr-1 flex h-3 w-3">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                        </span>
                    </button>
                </div>
            </header>

            <!-- VIEW CONTAINER -->
            <main class="flex-1 overflow-y-auto p-4 lg:p-8 mt-16 pb-20 md:pb-8 bg-slate-50" id="view-container">
                <!-- Konten Halaman akan dirender di sini oleh JS -->
            </main>
        </div>

        <!-- BOTTOM NAVIGATION (Mobile Only - For Logged In Users) -->
        <nav id="bottom-nav"
            class="hidden md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around p-2 z-20 pb-safe">
            <!-- Dinamis diisi oleh JS -->
        </nav>

        <!-- FULLSCREEN LOADER OVERLAY -->
        <div id="global-loader"
            class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 z-50 flex flex-col items-center justify-center text-white backdrop-blur-sm">
            <div class="loader mb-4 w-12 h-12 border-4 border-t-blue-500 border-white"></div>
            <p class="font-medium animate-pulse">Memproses Data...</p>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /* ==========================================
           1. KONFIGURASI & STATE MANAGEMENT
           ========================================== */
        // UBAH INI dengan URL Web App GAS Anda saat production
        const GAS_WEB_APP_URL = "";
        // Mode Preview: Jika GAS_WEB_APP_URL kosong, gunakan Mock Data
        const IS_PREVIEW = GAS_WEB_APP_URL === "";

        // App State
        let state = {
            user: null, // {id, role: 'admin'|'guru', name, username}
            currentRoute: 'home',
            data: {
                materi: [],
                tugas: [],
                siswa: [],
                guru: [],
                kelas: [],
                mapel: [], // Data baru untuk Mata Pelajaran
                stats: { totalGuru: 0, totalSiswa: 0, totalKelas: 0, totalMateri: 0 },
                currentViewData: null // Menyimpan konteks seperti nama kelas aktif
            }
        };

        /* ==========================================
           2. MOCK DATA ENGINE (UNTUK PREVIEW)
           ========================================== */
        const MOCK_DATA = {
            users: [
                { id: 'u1', username: 'admin', password: '123', role: 'admin', name: 'Admin Utama' },
                { id: 'u2', username: 'guru', password: '123', role: 'guru', name: 'Budi Santoso, S.Pd' }
            ],
            stats: { totalGuru: 24, totalSiswa: 350, totalKelas: 12, totalMateri: 85 },
            guru: [
                { id: 'g1', nama: 'Budi Santoso, S.Pd' },
                { id: 'g2', nama: 'Siti Aminah, S.Pd' },
                { id: 'g3', nama: 'Bapak Andi, S.Kom' }
            ],
            mapel: [
                { id: 'mp1', nama: 'Matematika' },
                { id: 'mp2', nama: 'Bahasa Indonesia' },
                { id: 'mp3', nama: 'Sejarah' },
                { id: 'mp4', nama: 'Informatika' }
            ],
            kelas: [
                { id: 'k1', nama: 'X IPA 1', wali: 'Budi Santoso, S.Pd' },
                { id: 'k2', nama: 'X IPA 2', wali: 'Bapak Andi, S.Kom' },
                { id: 'k3', nama: 'XI IPS 2', wali: 'Siti Aminah, S.Pd' }
            ],
            materi: [
                { id: 'm1', judul: 'Aljabar Linier Dasar', mapel: 'Matematika', kelas: 'X IPA 1', tipe: 'pdf', pembuat: 'Budi Santoso, S.Pd', date: '2026-06-10', link: 'https://drive.google.com/' },
                { id: 'm2', judul: 'Sejarah Kemerdekaan', mapel: 'Sejarah', kelas: 'XI IPS 2', tipe: 'youtube', pembuat: 'Siti Aminah, S.Pd', date: '2026-06-12', link: 'https://youtube.com/' },
            ],
            tugas: [
                { id: 't1', judul: 'Latihan Aljabar 1', mapel: 'Matematika', kelas: 'X IPA 1', deadline: '2026-06-20', terkumpul: 25, total: 30 },
            ],
            siswa: [
                { id: 's1', nis: '1001', nama: 'Ahmad Dahlan', kelas: 'X IPA 1', jk: 'L' },
                { id: 's2', nis: '1002', nama: 'Siti Fatimah', kelas: 'X IPA 1', jk: 'P' },
                { id: 's3', nis: '1003', nama: 'Budi Raharjo', kelas: 'X IPA 2', jk: 'L' },
            ]
        };

        /* ==========================================
           3. CORE FUNCTIONS (API & AUTH)
           ========================================== */

        async function apiCall(action, payload = {}) {
            showLoader();
            try {
                if (IS_PREVIEW) {
                    // Simulasi Network Delay
                    await new Promise(resolve => setTimeout(resolve, 600));
                    return handleMockApi(action, payload);
                } else {
                    // Real GAS Call
                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action, payload })
                    });
                    return await response.json();
                }
            } catch (error) {
                console.error("API Error:", error);
                Swal.fire('Error', 'Terjadi kesalahan koneksi', 'error');
                return { success: false, message: error.message };
            } finally {
                hideLoader();
            }
        }

        function handleMockApi(action, payload) {
            switch (action) {
                case 'login':
                    const user = MOCK_DATA.users.find(u => u.username === payload.username && u.password === payload.password);
                    if (user) return { success: true, data: { id: user.id, role: user.role, name: user.name } };
                    return { success: false, message: 'Username atau Password salah' };
                case 'get_dashboard':
                    return { success: true, data: MOCK_DATA.stats };
                case 'get_materi':
                    return { success: true, data: MOCK_DATA.materi };
                case 'save_materi':
                    // Gunakan pembuat dari payload jika ada, jika tidak fallback ke nama user
                    const pembuatMateri = payload.pembuat || state.user.name;
                    const newMateri = { ...payload, id: 'm' + Date.now(), date: new Date().toISOString().split('T')[0], pembuat: pembuatMateri };
                    MOCK_DATA.materi.unshift(newMateri);
                    return { success: true, message: 'Materi berhasil disimpan', data: newMateri };
                case 'get_kelas':
                    return { success: true, data: MOCK_DATA.kelas };
                case 'save_kelas':
                    const newKelas = { ...payload, id: 'k' + Date.now() };
                    MOCK_DATA.kelas.push(newKelas);
                    return { success: true, message: 'Kelas berhasil dibuat', data: newKelas };
                case 'get_guru':
                    return { success: true, data: MOCK_DATA.guru };
                case 'save_guru':
                    const newGuru = { ...payload, id: 'g' + Date.now() };
                    MOCK_DATA.guru.push(newGuru);
                    return { success: true, message: 'Guru berhasil ditambahkan', data: newGuru };
                case 'get_mapel':
                    return { success: true, data: MOCK_DATA.mapel };
                case 'save_mapel':
                    const newMapel = { ...payload, id: 'mp' + Date.now() };
                    MOCK_DATA.mapel.push(newMapel);
                    return { success: true, message: 'Mata Pelajaran berhasil ditambahkan', data: newMapel };
                case 'get_siswa':
                    return { success: true, data: MOCK_DATA.siswa };
                case 'save_siswa':
                    const newSiswa = { ...payload, id: 's' + Date.now() };
                    MOCK_DATA.siswa.push(newSiswa);
                    return { success: true, message: 'Siswa berhasil ditambahkan ke kelas', data: newSiswa };
                case 'get_tugas':
                    return { success: true, data: MOCK_DATA.tugas };
                default:
                    return { success: false, message: 'Action not found in mock' };
            }
        }

        async function login(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const res = await apiCall('login', { username: user, password: pass });
            if (res.success) {
                state.user = res.data;
                localStorage.setItem('sls_user', JSON.stringify(res.data));
                Swal.fire({ icon: 'success', title: 'Login Berhasil', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
                setupLayout();
                navigate('dashboard');
            } else {
                Swal.fire('Gagal', res.message, 'error');
            }
        }

        function logout() {
            Swal.fire({
                title: 'Keluar?', text: "Anda akan keluar dari sistem", icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Logout'
            }).then((result) => {
                if (result.isConfirmed) {
                    state.user = null;
                    localStorage.removeItem('sls_user');
                    setupLayout();
                    navigate('home');
                }
            });
        }

        function checkAuth() {
            const saved = localStorage.getItem('sls_user');
            if (saved) {
                state.user = JSON.parse(saved);
                return true;
            }
            return false;
        }

        /* ==========================================
           4. ROUTING & UI LAYOUT
           ========================================== */

        const ROUTES = {
            'home': { title: 'Beranda', auth: false, render: renderHome },
            'login': { title: 'Login Sistem', auth: false, render: renderLogin },
            'public-materi': { title: 'Materi Pembelajaran', auth: false, render: renderPublicMateri },
            'dashboard': { title: 'Dashboard', auth: true, render: renderDashboard },
            'guru': { title: 'Master Data Guru', auth: true, render: renderGuruAdmin },
            'mapel': { title: 'Master Data Mapel', auth: true, render: renderMapelAdmin },
            'kelas': { title: 'Master Data Kelas', auth: true, render: renderKelasAdmin },
            'materi': { title: 'Manajemen Materi', auth: true, render: renderMateriAdmin },
            'tugas': { title: 'Manajemen Tugas', auth: true, render: renderTugasAdmin },
            'nilai': { title: 'Buku Nilai', auth: true, render: renderNilaiPlaceholder }
        };

        const MENU_ITEMS = [
            { id: 'dashboard', icon: 'fa-home', label: 'Dashboard', roles: ['admin', 'guru'] },
            { id: 'guru', icon: 'fa-user-tie', label: 'Data Guru', roles: ['admin'] },
            { id: 'mapel', icon: 'fa-book', label: 'Mapel', roles: ['admin'] },
            { id: 'kelas', icon: 'fa-school', label: 'Kelas & Siswa', roles: ['admin'] },
            { id: 'materi', icon: 'fa-book-open', label: 'Materi', roles: ['admin', 'guru'] },
            { id: 'tugas', icon: 'fa-tasks', label: 'Tugas', roles: ['admin', 'guru'] },
            { id: 'nilai', icon: 'fa-chart-bar', label: 'Nilai & Rapor', roles: ['admin', 'guru'] },
        ];

        function navigate(routeId) {
            const route = ROUTES[routeId];
            if (!route) return;

            // Protection
            if (route.auth && !state.user) {
                navigate('login'); return;
            }
            if (!route.auth && state.user && routeId === 'login') {
                navigate('dashboard'); return;
            }

            state.currentRoute = routeId;
            document.getElementById('page-title').innerText = route.title;

            // Render View
            const container = document.getElementById('view-container');
            container.innerHTML = '';
            container.className = 'flex-1 overflow-y-auto p-4 lg:p-8 mt-16 pb-20 md:pb-8 bg-slate-50 page-transition';
            route.render(container);

            updateActiveMenu();

            // Close mobile sidebar if open
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) toggleMobileMenu();
        }

        function setupLayout() {
            const sidebar = document.getElementById('sidebar');
            const mainWrap = document.getElementById('main-wrapper');
            const publicNav = document.getElementById('public-nav');
            const notifBtn = document.getElementById('notif-btn');
            const bottomNav = document.getElementById('bottom-nav');

            if (state.user) {
                // Logged In Layout
                sidebar.classList.remove('hidden');
                sidebar.classList.add('-translate-x-full', 'md:translate-x-0'); // hidden on mobile by default
                mainWrap.classList.add('md:ml-64');
                publicNav.classList.add('hidden');
                notifBtn.classList.remove('hidden');
                bottomNav.classList.remove('hidden');
                document.getElementById('top-navbar').classList.add('md:w-[calc(100%-16rem)]');

                // Set User Info
                document.getElementById('sidebar-name').innerText = state.user.name;
                document.getElementById('sidebar-role').innerText = state.user.role;
                document.getElementById('sidebar-avatar').innerText = state.user.name.charAt(0);

                buildMenus();
            } else {
                // Public Layout
                sidebar.classList.add('hidden');
                mainWrap.classList.remove('md:ml-64');
                publicNav.classList.remove('hidden');
                notifBtn.classList.add('hidden');
                bottomNav.classList.add('hidden');
                document.getElementById('top-navbar').classList.remove('md:w-[calc(100%-16rem)]');
            }
        }

        function buildMenus() {
            const sidebarNav = document.getElementById('sidebar-nav');
            const bottomNav = document.getElementById('bottom-nav');
            sidebarNav.innerHTML = '';
            bottomNav.innerHTML = '';

            const userRole = state.user.role;

            MENU_ITEMS.filter(m => m.roles.includes(userRole)).forEach(menu => {
                // Desktop Sidebar Menu
                const a = document.createElement('a');
                a.href = `#${menu.id}`;
                a.onclick = (e) => { e.preventDefault(); navigate(menu.id); };
                a.className = `menu-item flex items-center p-3 text-sm font-medium rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors mb-1`;
                a.dataset.target = menu.id;
                a.innerHTML = `<i class="fas ${menu.icon} w-6 text-center mr-2"></i> ${menu.label}`;
                sidebarNav.appendChild(a);

                // Mobile Bottom Nav Menu
                const b = document.createElement('a');
                b.href = `#${menu.id}`;
                b.onclick = (e) => { e.preventDefault(); navigate(menu.id); };
                b.className = `bottom-item flex flex-col items-center justify-center w-full text-slate-500 hover:text-blue-600 transition-colors`;
                b.dataset.target = menu.id;
                b.innerHTML = `<i class="fas ${menu.icon} text-xl mb-1"></i><span class="text-[10px] font-medium">${menu.label}</span>`;
                bottomNav.appendChild(b);
            });
        }

        function updateActiveMenu() {
            document.querySelectorAll('.menu-item').forEach(el => {
                if (el.dataset.target === state.currentRoute) {
                    el.classList.add('bg-blue-600', 'text-white');
                    el.classList.remove('text-slate-300', 'hover:bg-slate-800');
                } else {
                    el.classList.remove('bg-blue-600', 'text-white');
                    el.classList.add('text-slate-300', 'hover:bg-slate-800');
                }
            });
            document.querySelectorAll('.bottom-item').forEach(el => {
                if (el.dataset.target === state.currentRoute) {
                    el.classList.add('text-blue-600');
                    el.classList.remove('text-slate-500');
                } else {
                    el.classList.remove('text-blue-600');
                    el.classList.add('text-slate-500');
                }
            });
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full', 'hidden');
                sidebar.classList.add('translate-x-0');
            } else {
                sidebar.classList.add('-translate-x-full');
            }
        }

        // Utils
        function showLoader() { document.getElementById('global-loader').classList.remove('hidden'); }
        function hideLoader() { document.getElementById('global-loader').classList.add('hidden'); }
        function base64Encode(str) { return btoa(unescape(encodeURIComponent(str))); }
        function base64Decode(str) { return decodeURIComponent(escape(atob(str))); }


        /* ==========================================
           5. VIEW RENDERERS (HALAMAN)
           ========================================== */

        // -- PUBLIC: HOME --
        function renderHome(container) {
            container.innerHTML = `
                <div class="max-w-6xl mx-auto">
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-8 md:p-16 text-white text-center shadow-lg">
                        <h1 class="text-3xl md:text-5xl font-bold mb-4">Masa Depan Pendidikan Digital</h1>
                        <p class="text-lg md:text-xl text-blue-100 mb-8 max-w-2xl mx-auto">Smart Learning School mengintegrasikan materi, tugas, dan evaluasi dalam satu platform yang mudah digunakan oleh guru dan siswa.</p>
                        <div class="flex justify-center space-x-4">
                            <button onclick="navigate('public-materi')" class="bg-white text-blue-600 px-6 py-3 rounded-lg font-semibold hover:bg-slate-100 transition shadow">Jelajahi Materi</button>
                            <button onclick="navigate('login')" class="bg-blue-800 bg-opacity-50 border border-blue-400 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-800 transition">Login Sistem</button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mt-12">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 text-center hover:shadow-md transition">
                            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4"><i class="fas fa-book-open"></i></div>
                            <h3 class="text-xl font-bold text-slate-800 mb-2">Materi Terstruktur</h3>
                            <p class="text-slate-600">Akses modul pembelajaran, video YouTube, dan dokumen dalam satu klik tanpa repot mencari.</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 text-center hover:shadow-md transition">
                            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4"><i class="fas fa-tasks"></i></div>
                            <h3 class="text-xl font-bold text-slate-800 mb-2">Tugas & Kuis Online</h3>
                            <p class="text-slate-600">Pengumpulan tugas digital dan sistem kuis otomatis dengan penilaian seketika (real-time).</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 text-center hover:shadow-md transition">
                            <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4"><i class="fas fa-chart-line"></i></div>
                            <h3 class="text-xl font-bold text-slate-800 mb-2">Monitoring Nilai</h3>
                            <p class="text-slate-600">Pantau perkembangan akademik siswa dengan buku nilai terintegrasi dan cetak rapor mudah.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // -- PUBLIC: LOGIN --
        function renderLogin(container) {

            if (!kelasName || kelasName === 'Semua Kelas') {
                container.classList.add('hidden');
                return;
            }

            const siswaKelas = state.data.siswa.filter(s => s.kelas === kelasName);

                countEl.innerText = siswaKelas.length;
                listEl.innerText = siswaKelas.map(s => s.nama).join(', ');

        document.addEventListener('DOMContentLoaded', () => {
            // Check auth state
            checkAuth();
            setupLayout();

            // Handle Hash Routing
            const initialRoute = window.location.hash.replace('#', '') || (state.user ? 'dashboard' : 'home');
            navigate(initialRoute);

            // Mobile menu toggler
            document.getElementById('mobile-menu-btn').addEventListener('click', toggleMobileMenu);

            // Listen to Hash Changes
            window.addEventListener('hashchange', () => {
                const route = window.location.hash.replace('#', '');
                if (route) navigate(route);
            });
        });

    </script>
</body>

</html>
